<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Shopping List</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles if needed */
        .list-item-checked {
            text-decoration: line-through;
            color: #9ca3af;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-md rounded-xl shadow-lg overflow-hidden">
        <div class="p-6">
            <h1 class="text-2xl font-bold text-gray-800 mb-6 text-center">🛒 AI Shopping List</h1>

            <!-- AI Prompt Section -->
            <div class="mb-6">
                <label for="ai-prompt" class="block text-sm font-medium text-gray-700 mb-2">Ask AI to add ingredients</label>
                <div class="flex gap-2">
                    <input type="text" id="ai-prompt" placeholder="e.g., 'I want to make pizza'" 
                           class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <button id="ai-btn" class="bg-purple-600 hover:bg-purple-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                        ✨ Ask AI
                    </button>
                </div>
                <p id="ai-status" class="text-xs text-gray-500 mt-2 hidden"></p>
            </div>

            <hr class="my-6">

            <!-- Manual Add Section -->
            <div class="flex gap-2 mb-6">
                <input type="text" id="item-input" placeholder="Add an item..." 
                       class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button id="add-btn" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors">
                    Add
                </button>
            </div>

            <!-- Shopping List -->
            <ul id="shopping-list" class="space-y-3 max-h-80 overflow-y-auto pr-2">
                <!-- List items will be injected here -->
            </ul>

            <!-- Empty State -->
            <div id="empty-state" class="text-center py-10 text-gray-400 hidden">
                <p>Your list is empty!</p>
            </div>
        </div>

        <!-- Footer/Clear -->
        <div class="bg-gray-50 px-6 py-4 flex justify-between items-center">
            <button id="clear-btn" class="text-sm text-red-600 hover:text-red-800 font-medium">Clear List</button>
            <span id="item-count" class="text-sm text-gray-500">0 items</span>
        </div>
    </div>

    <script>
        const aiPromptInput = document.getElementById('ai-prompt');
        const aiBtn = document.getElementById('ai-btn');
        const aiStatus = document.getElementById('ai-status');
        const itemInput = document.getElementById('item-input');
        const addBtn = document.getElementById('add-btn');
        const shoppingListElement = document.getElementById('shopping-list');
        const emptyState = document.getElementById('empty-state');
        const itemCountSpan = document.getElementById('item-count');
        const clearBtn = document.getElementById('clear-btn');

        let shoppingList = JSON.parse(localStorage.getItem('shoppingList')) || [];

        function saveList() {
            localStorage.setItem('shoppingList', JSON.stringify(shoppingList));
            renderList();
        }

        function addItem(name) {
            const trimmedName = name.trim();
            if (trimmedName) {
                shoppingList.push({ id: Date.now() + Math.random(), name: trimmedName, checked: false });
                saveList();
            }
        }

        function removeItem(id) {
            shoppingList = shoppingList.filter(item => item.id !== id);
            saveList();
        }

        function toggleItem(id) {
            shoppingList = shoppingList.map(item => 
                item.id === id ? { ...item, checked: !item.checked } : item
            );
            saveList();
        }

        function clearList() {
            if (confirm('Are you sure you want to clear the entire list?')) {
                shoppingList = [];
                saveList();
            }
        }

        function renderList() {
            shoppingListElement.innerHTML = '';
            
            if (shoppingList.length === 0) {
                emptyState.classList.remove('hidden');
            } else {
                emptyState.classList.add('hidden');
                shoppingList.forEach(item => {
                    const li = document.createElement('li');
                    li.className = 'flex items-center justify-between bg-gray-50 p-3 rounded-lg group hover:bg-gray-100 transition-colors';
                    
                    const contentDiv = document.createElement('div');
                    contentDiv.className = 'flex items-center gap-3 flex-1 cursor-pointer';
                    contentDiv.onclick = () => toggleItem(item.id);

                    const checkbox = document.createElement('div');
                    checkbox.className = `w-5 h-5 rounded border flex items-center justify-center transition-colors ${item.checked ? 'bg-blue-500 border-blue-500' : 'border-gray-300 bg-white'}`;
                    if (item.checked) {
                        checkbox.innerHTML = '<svg class="w-3 h-3 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>';
                    }

                    const text = document.createElement('span');
                    text.textContent = item.name;
                    text.className = `text-sm font-medium text-gray-700 ${item.checked ? 'list-item-checked' : ''}`;

                    contentDiv.appendChild(checkbox);
                    contentDiv.appendChild(text);

                    const deleteBtn = document.createElement('button');
                    deleteBtn.innerHTML = '<svg class="w-4 h-4 text-gray-400 hover:text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>';
                    deleteBtn.className = 'opacity-0 group-hover:opacity-100 transition-opacity p-1';
                    deleteBtn.onclick = (e) => {
                        e.stopPropagation();
                        removeItem(item.id);
                    };

                    li.appendChild(contentDiv);
                    li.appendChild(deleteBtn);
                    shoppingListElement.appendChild(li);
                });
            }

            itemCountSpan.textContent = `${shoppingList.length} item${shoppingList.length !== 1 ? 's' : ''}`;
        }

        addBtn.onclick = () => {
            addItem(itemInput.value);
            itemInput.value = '';
        };

        itemInput.onkeypress = (e) => {
            if (e.key === 'Enter') {
                addBtn.onclick();
            }
        };

        clearBtn.onclick = clearList;

        // Initial render
        renderList();
    </script>
</body>
</html>
