# Docker Compose deployment of the AI supported shopping list.
#
#   docker compose up -d --build
#
# Ollama is NOT part of this file: it runs on the host OS and the backend reaches it via
# host.docker.internal. On a Linux host, start Ollama with OLLAMA_HOST=0.0.0.0 so that
# containers can reach it, and pull the model first (ollama pull <model>).
#
# Configuration is split into three files, all gitignored:
#   .env           (optional) how the deployment is reached: URLs and ports, see .env.example
#   backend/.env   backend options (auth, model, limits, ...), see backend/.env.example
#   frontend/.env  frontend options (auth mode, Firebase web API key), see frontend/.env.example
# The values that depend on the deployment (URLs, credential path) are set here and
# override the ones in backend/.env and frontend/.env, so the same .env files can be
# used for local development and for Compose.
#
# The browser talks to the frontend AND directly to the backend, so both ports are
# published. Ollama is only ever contacted by the backend.

name: shopping-list

services:
  backend:
    build: ./backend
    image: shopping-list-backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      # Origin of the frontend as the browser sees it (scheme://host:port, no path).
      CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase_service_account
    secrets:
      - firebase_service_account
    extra_hosts:
      # Docker Desktop provides host.docker.internal already; plain Linux Docker needs this.
      - host.docker.internal:host-gateway
    ports:
      - ${BACKEND_PORT:-8000}:8000
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  frontend:
    build: ./frontend
    image: shopping-list-frontend
    restart: unless-stopped
    env_file: ./frontend/.env
    environment:
      # URL the BROWSER uses to reach the backend (not the Docker-internal name), without /api/v1.
      PUBLIC_BACKEND_URL: ${BACKEND_URL:-http://localhost:8000}
    ports:
      - ${FRONTEND_PORT:-3000}:3000
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

secrets:
  # Firestore service account key. The backend runs as uid 10001, so the file must be
  # readable by it (e.g. chmod 644).
  firebase_service_account:
    file: ${FIREBASE_SERVICE_ACCOUNT_FILE:-./backend/secrets/firebase-service-account.json}
